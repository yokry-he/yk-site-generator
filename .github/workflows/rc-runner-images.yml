name: RC Runner Images

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push images to GHCR
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [hono-drizzle, nestjs-prisma, fastapi-sqlalchemy, spring-boot-jpa, gin-gorm]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build or push immutable image
        uses: docker/build-push-action@v6
        with:
          context: infra/runner/${{ matrix.stack }}
          push: ${{ inputs.push }}
          tags: ghcr.io/${{ github.repository_owner }}/siteforge-runner-${{ matrix.stack }}:${{ github.sha }}
          outputs: ${{ inputs.push && 'type=registry' || 'type=docker,dest=/tmp/runner.tar' }}
      - name: Capture digest
        run: |
          mkdir -p artifacts/runner-images
          if [[ "${{ inputs.push }}" == "true" ]]; then
            docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/siteforge-runner-${{ matrix.stack }}:${{ github.sha }}" --format '{{json .Manifest.Digest}}' > "artifacts/runner-images/${{ matrix.stack }}.digest"
          else
            sha256sum /tmp/runner.tar > "artifacts/runner-images/${{ matrix.stack }}.archive.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: runner-image-${{ matrix.stack }}
          path: artifacts/runner-images
          retention-days: 14
