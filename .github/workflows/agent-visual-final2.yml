name: Agent Visual Final 2
on:
  push:
    branches: [agent/continue-development-20260723]
    paths: ['.github/agent-visual-final2.trigger']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/continue-development-20260723
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Add preview button labels
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/pages/TemplateDetailPage.vue')
          text = path.read_text()
          old = '<button v-for="item in [{id:\'desktop\',icon:Monitor},{id:\'tablet\',icon:Tablet},{id:\'mobile\',icon:Smartphone}]" :key="item.id" class="rounded-md p-1.5"'
          new = '<button v-for="item in [{id:\'desktop\',icon:Monitor},{id:\'tablet\',icon:Tablet},{id:\'mobile\',icon:Smartphone}]" :key="item.id" :aria-label="item.id === \'desktop\' ? \'桌面预览\' : item.id === \'tablet\' ? \'平板预览\' : \'手机预览\'" class="rounded-md p-1.5"'
          count = text.count(old)
          if count != 1:
            raise SystemExit(f'expected one viewport control group, found {count}')
          path.write_text(text.replace(old, new))
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Verify behavior and accessibility
        run: pnpm --filter web e2e:browser
      - name: Generate visual baselines
        run: pnpm --filter web e2e:visual:update
      - name: Commit verified visual suite
        run: |
          rm -f .github/agent-visual-final2.trigger .github/workflows/agent-visual-final2.yml .github/agent-visual-final-status.md
          git config user.name "siteforge-agent"
          git config user.email "siteforge-agent@users.noreply.github.com"
          git add -A
          git commit -m "test(web): add verified visual regression baselines"
          git push origin HEAD:agent/continue-development-20260723
