name: Agent Interaction Finalize
on:
  push:
    branches: [agent/continue-development-20260723]
    paths: ['.github/agent-interaction-finalize.trigger']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/continue-development-20260723
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact interaction patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {actual}: {old[:100]!r}')
              file.write_text(text.replace(old, new))

          # Template filters: accessible names and readable small badges.
          path = 'apps/web/src/pages/TemplatesPage.vue'
          replace(path, 'v-model="category" class="w-full appearance-none', 'v-model="category" aria-label="模板分类" class="w-full appearance-none')
          replace(path, 'v-model="industry" class="w-full appearance-none', 'v-model="industry" aria-label="模板行业" class="w-full appearance-none')
          replace(path, 'v-model="style" class="w-full appearance-none', 'v-model="style" aria-label="模板风格" class="w-full appearance-none')
          replace(path, 'v-model="sort" class="w-full appearance-none', 'v-model="sort" aria-label="模板排序" class="w-full appearance-none')
          replace(path, 'class="hidden rounded-xl border border-line/10 p-2.5 text-faint hover:text-ink lg:block" @click="loadCatalog(true)"', 'aria-label="刷新模板目录" class="hidden rounded-xl border border-line/10 p-2.5 text-faint hover:text-ink lg:block" @click="loadCatalog(true)"')
          replace(path, 'class="rounded bg-brand1/10 px-2 py-0.5 text-[9px] text-brand1"', 'class="rounded bg-brand1/10 px-2 py-0.5 text-[9px] font-semibold text-sub"', count=1)
          replace(path, 'class="rounded bg-violet-500/10 px-2 py-0.5 text-[9px] text-violet-500"', 'class="rounded bg-violet-500/10 px-2 py-0.5 text-[9px] font-semibold text-sub"', count=1)
          replace(path, '<button class="mt-5 flex w-full items-center justify-center gap-1.5 rounded-xl border border-line/10 bg-app/45 px-3 py-2.5 text-xs font-semibold text-sub hover:border-brand1/25 hover:text-brand1" @click="openTemplate(template)"><Eye class="h-3.5 w-3.5" />预览并使用</button>', '<div class="mt-5 grid grid-cols-2 gap-2"><button class="flex items-center justify-center gap-1.5 rounded-xl border border-line/10 bg-app/45 px-3 py-2.5 text-xs font-semibold text-sub hover:border-brand1/25 hover:text-brand1" @click="openTemplate(template)"><Eye class="h-3.5 w-3.5" />快速预览</button><RouterLink :to="`/templates/${template.slug}`" class="flex items-center justify-center gap-1.5 rounded-xl bg-brand1/10 px-3 py-2.5 text-xs font-semibold text-brand1 hover:bg-brand1/15">完整详情<ArrowRight class="h-3.5 w-3.5" /></RouterLink></div>')

          # Project permanent deletion: typed-name confirmation.
          path = 'apps/web/src/pages/ProjectsPage.vue'
          replace(path, "import { useAuth } from '../composables/useAuth'", "import { useAuth } from '../composables/useAuth'\nimport { confirmDialog } from '../composables/useConfirmDialog'")
          replace(path, "const permanentConfirmId = ref('')\n", '')
          replace(path, "async function permanentlyDelete(project: CloudProject) {\n  if (permanentConfirmId.value !== project.id) {\n    permanentConfirmId.value = project.id\n    toast.info('再次点击永久删除', '该操作会删除全部版本和反馈，无法恢复。')\n    return\n  }\n  actionBusyId.value = project.id\n  try {\n    await deleteProject(project.id)\n    projects.value = projects.value.filter((item) => item.id !== project.id)\n    permanentConfirmId.value = ''\n    toast.success('项目已永久删除')\n  } catch (err) { toast.error('删除失败', messageOf(err)) } finally { actionBusyId.value = '' }\n}", "async function permanentlyDelete(project: CloudProject) {\n  openMenu.value = ''\n  const confirmed = await confirmDialog({\n    title: `永久删除「${project.title}」？`,\n    description: '项目、全部不可变版本、质量反馈和发布关联都会被移除，且无法恢复。',\n    confirmLabel: '永久删除',\n    tone: 'danger',\n    verificationText: project.title,\n    verificationLabel: `请输入项目名称「${project.title}」确认`,\n  })\n  if (!confirmed) return\n  actionBusyId.value = project.id\n  try {\n    await deleteProject(project.id)\n    projects.value = projects.value.filter((item) => item.id !== project.id)\n    toast.success('项目已永久删除')\n  } catch (err) { toast.error('删除失败', messageOf(err)) } finally { actionBusyId.value = '' }\n}")
          replace(path, "{{ permanentConfirmId === project.id ? '确认永久删除' : '永久删除' }}", '永久删除')

          # Brand asset deletion: shared confirm dialog with clear impact.
          path = 'apps/web/src/pages/BrandAssetsPage.vue'
          replace(path, "import { useAuth } from '../composables/useAuth'", "import { useAuth } from '../composables/useAuth'\nimport { confirmDialog } from '../composables/useConfirmDialog'")
          replace(path, "  if (!window.confirm(`永久删除资源「${asset.name}」？已插入项目的副本不会受影响。`)) return", "  const confirmed = await confirmDialog({\n    title: `删除资源「${asset.name}」？`,\n    description: '资源库中的原文件会被删除；已经插入项目版本的副本不会受影响。',\n    confirmLabel: '删除资源',\n    tone: 'danger',\n  })\n  if (!confirmed) return")

          # Visual baseline test should target the primary project action precisely.
          path = 'apps/web/tests/e2e/visual.spec.ts'
          replace(path, "page.getByRole('button', { name: /可视化编辑/ }).click()", "page.getByRole('button', { name: '可视化编辑', exact: true }).click()")
          PY
      - name: Commit finalized interactions
        run: |
          rm -f .github/agent-interaction-finalize.trigger .github/workflows/agent-interaction-finalize.yml
          git config user.name "siteforge-agent"
          git config user.email "siteforge-agent@users.noreply.github.com"
          git add -A
          git commit -m "fix(web): finalize accessible interactions and confirmations"
          git push origin HEAD:agent/continue-development-20260723
