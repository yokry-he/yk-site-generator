name: Agent Playwright Bootstrap
on:
  push:
    branches: [agent/continue-development-20260723]
    paths: ['.github/workflows/agent-playwright-bootstrap.yml']
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/continue-development-20260723
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Update lockfile and install browser
        run: |
          pnpm install --no-frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Generate visual baselines
        working-directory: apps/web
        run: pnpm e2e:visual:update
      - name: Commit generated artifacts
        run: |
          rm .github/workflows/agent-playwright-bootstrap.yml
          git config user.name 'SiteForge Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add pnpm-lock.yaml apps/web/tests/e2e apps/web/playwright.config.ts .github/workflows/agent-playwright-bootstrap.yml
          git commit -m 'test(web): lock Playwright and add visual baselines'
          git push origin HEAD:agent/continue-development-20260723
