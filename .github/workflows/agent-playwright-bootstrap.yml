name: Agent Playwright Lockfile
on:
  push:
    branches: [agent/continue-development-20260723]
    paths: ['.github/workflows/agent-playwright-bootstrap.yml']
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/continue-development-20260723
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Generate reproducible dependency lock
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile
        run: |
          rm .github/workflows/agent-playwright-bootstrap.yml
          git config user.name 'SiteForge Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add pnpm-lock.yaml .github/workflows/agent-playwright-bootstrap.yml
          git commit -m 'chore: lock Playwright browser test dependencies'
          git push origin HEAD:agent/continue-development-20260723
