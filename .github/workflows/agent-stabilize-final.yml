name: Agent Stabilize Final
on:
  push:
    branches: [agent/continue-development-20260723]
    paths: ['.github/agent-stabilize-final.trigger']
permissions:
  contents: write
jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/continue-development-20260723
      - name: Apply exact final accessibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/pages/TemplateDetailPage.vue')
          text = path.read_text()
          replacements = [
            ("<div class=\"flex rounded-lg bg-ink/[0.04] p-1\"><button v-for=\"item in [{id:'desktop',icon:Monitor},{id:'tablet',icon:Tablet},{id:'mobile',icon:Smartphone}]\" :key=\"item.id\" class=\"rounded-md p-1.5\" :class=\"viewport === item.id ? 'bg-soft text-brand1 shadow-sm' : 'text-faint'\" @click=\"viewport = item.id as typeof viewport\"><component :is=\"item.icon\" class=\"h-3.5 w-3.5\" /></button></div>", "<div class=\"flex rounded-lg bg-ink/[0.04] p-1\"><button v-for=\"item in [{id:'desktop',label:'桌面预览',icon:Monitor},{id:'tablet',label:'平板预览',icon:Tablet},{id:'mobile',label:'手机预览',icon:Smartphone}]\" :key=\"item.id\" :aria-label=\"item.label\" :title=\"item.label\" class=\"rounded-md p-1.5\" :class=\"viewport === item.id ? 'bg-soft text-sub shadow-sm' : 'text-faint'\" @click=\"viewport = item.id as typeof viewport\"><component :is=\"item.icon\" class=\"h-3.5 w-3.5\" /></button></div>"),
            ('class="grid h-7 w-7 place-items-center rounded-lg bg-brand1/10 text-[9px] font-bold text-brand1"', 'class="grid h-7 w-7 place-items-center rounded-lg bg-brand1/10 text-[9px] font-bold text-sub"'),
            ('<RouterLink to="/templates" class="text-sm text-brand1">查看全部</RouterLink>', '<RouterLink to="/templates" class="text-sm font-semibold text-sub hover:text-ink">查看全部</RouterLink>'),
          ]
          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'expected one match, found {count}: {old[:120]}')
            text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Remove one-time automation debris
        run: |
          rm -f \
            .github/agent-stabilize-final.trigger \
            .github/workflows/agent-stabilize-final.yml \
            .github/agent-visual-complete.trigger \
            .github/agent-visual-final2.trigger \
            .github/agent-visual-final-status.md \
            .github/workflows/agent-visual-complete.yml \
            .github/workflows/agent-visual-final2.yml \
            .github/workflows/agent-brand-2-1-cleanup.yml \
            .github/workflows/agent-confirmation-migration.yml \
            .github/workflows/agent-mobile-version-drawer.yml \
            visual-baseline-status.txt \
            visual-final-status.txt
      - name: Commit stabilized branch
        run: |
          git config user.name "siteforge-agent"
          git config user.email "siteforge-agent@users.noreply.github.com"
          git add -A
          git commit -m "fix(web): stabilize final accessibility and clean temporary workflows"
          git push origin HEAD:agent/continue-development-20260723
