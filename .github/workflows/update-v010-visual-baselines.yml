name: Refresh v0.1.0 Visual Baselines

on:
  push:
    branches:
      - Feature-dev-v0.1.0

permissions:
  contents: write

concurrency:
  group: refresh-v010-visual-baselines
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Feature-dev-v0.1.0
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Regenerate reviewed visual snapshots
        run: pnpm --filter web e2e:visual:update
      - name: Remove temporary workflow and commit snapshots
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/update-v010-visual-baselines.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/e2e/visual.spec.ts-snapshots
          git diff --cached --stat
          git commit -m "test(web): update reviewed multi-page visual baselines"
          git push origin HEAD:Feature-dev-v0.1.0
