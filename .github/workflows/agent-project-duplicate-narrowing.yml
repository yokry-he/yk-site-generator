name: Agent Project Duplicate Narrowing

on:
  push:
    branches: [agent/continue-development-20260723]
    paths:
      - '.github/workflows/agent-project-duplicate-narrowing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/continue-development-20260723
          fetch-depth: 0
      - name: Apply project version parent narrowing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/server/src/routes/projects.ts')
          text = path.read_text()
          old = """    const versions = sourceVersions.map((sourceVersion) => {\n      const id = randomUUID()\n      idMap.set(sourceVersion.id, id)\n      const version: ProjectVersionRecord = {\n        ...structuredClone(sourceVersion),\n        id,\n        projectId: project.id,\n        parentVersionId: sourceVersion.parentVersionId ? idMap.get(sourceVersion.parentVersionId) : undefined,\n        createdAt: now,\n      }\n"""
          new = """    const versions = sourceVersions.map((sourceVersion) => {\n      const id = randomUUID()\n      const parentVersionId = sourceVersion.parentVersionId\n      idMap.set(sourceVersion.id, id)\n      const version: ProjectVersionRecord = {\n        ...structuredClone(sourceVersion),\n        id,\n        projectId: project.id,\n        parentVersionId: parentVersionId ? idMap.get(parentVersionId) : undefined,\n        createdAt: now,\n      }\n"""
          if old not in text:
              raise SystemExit('Expected duplicate version mapping block not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/agent-project-duplicate-narrowing.yml').unlink()
          PY
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SiteForge Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(server): narrow duplicated version parent id'
          git push origin HEAD:agent/continue-development-20260723
