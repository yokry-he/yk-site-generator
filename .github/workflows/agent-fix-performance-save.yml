name: Apply Performance Save Fix

on:
  push:
    branches: [agent/web-performance-baseline-20260724]
    paths: [.github/workflows/agent-fix-performance-save.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/web-performance-baseline-20260724
      - name: 修复保存性能场景前置条件
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/scripts/performance-baseline.ts')
          text = path.read_text()
          old = """        const saveStartedAt = nodePerformance.now()
        await editor.getByRole('button', { name: /保存为新版本/ }).click()
        await editor.getByText(/已保存/).waitFor({ state: 'visible' })
        samples.push({ scenario: 'version-save', device: 'desktop', run, durationMs: round(nodePerformance.now() - saveStartedAt) })
"""
          new = """        await editor.getByRole('button', { name: '添加' }).click()
        await editor.getByRole('button', { name: /行动号召/ }).click()
        const saveButton = editor.getByRole('button', { name: /保存为新版本/ })
        await saveButton.waitFor({ state: 'visible' })
        const saveStartedAt = nodePerformance.now()
        await saveButton.click()
        await editor.getByText(/已保存/).waitFor({ state: 'visible' })
        samples.push({ scenario: 'version-save', device: 'desktop', run, durationMs: round(nodePerformance.now() - saveStartedAt) })
"""
          if old not in text:
              raise SystemExit('target snippet not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/agent-fix-performance-save.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/scripts/performance-baseline.ts .github/workflows/agent-fix-performance-save.yml
          git commit -m "fix(perf): prepare editor before version save"
          git push origin HEAD:agent/web-performance-baseline-20260724
