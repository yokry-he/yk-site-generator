name: Update MySQL lockfile

on:
  push:
    branches: [agent/continue-development-20260723]
    paths:
      - apps/server/package.json

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/continue-development-20260723
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 生成锁文件
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: 提交锁文件
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "锁文件无需更新"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: update lockfile for mysql adapter"
          git push origin HEAD:agent/continue-development-20260723
