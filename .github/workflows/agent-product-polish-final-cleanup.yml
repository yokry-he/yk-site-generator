name: Agent Product Polish Final Cleanup

on:
  push:
    branches: [agent/continue-development-20260723]
    paths:
      - '.github/workflows/agent-product-polish-final-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/continue-development-20260723
          fetch-depth: 0
      - name: Remove final unused import
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/pages/TemplatesPage.vue')
          text = path.read_text()
          needle = '  Palette,\n'
          if needle not in text:
              raise SystemExit('TemplatesPage Palette import not found')
          path.write_text(text.replace(needle, '', 1))
          Path('.github/workflows/agent-product-polish-final-cleanup.yml').unlink()
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SiteForge Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(web): remove final product polish diagnostic'
          git push origin HEAD:agent/continue-development-20260723
