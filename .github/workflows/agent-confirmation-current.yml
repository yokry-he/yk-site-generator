name: Agent Confirmation Current
on:
  push:
    branches: [agent/continue-development-20260723]
    paths: ['.github/workflows/agent-confirmation-current.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/continue-development-20260723
          fetch-depth: 0
      - name: Apply current-head confirmation changes
        run: |
          python - <<'PY'
          from pathlib import Path
          projects=Path('apps/web/src/pages/ProjectsPage.vue')
          text=projects.read_text()
          if "useConfirmDialog" not in text:
              text=text.replace("import { useAuth } from '../composables/useAuth'", "import { useAuth } from '../composables/useAuth'\nimport { confirmDialog } from '../composables/useConfirmDialog'",1)
          text=text.replace("const permanentConfirmId = ref('')\n",'')
          start=text.find('async function permanentlyDelete(project: CloudProject) {')
          end=text.find('\n}\n\nfunction setView',start)
          if start<0 or end<0: raise SystemExit('permanent delete block missing')
          block='''async function permanentlyDelete(project: CloudProject) {
  const confirmed = await confirmDialog({
    title: `永久删除「${project.title}」？`,
    description: '项目、全部不可变版本、反馈和发布关联都会被移除，且无法恢复。',
    confirmLabel: '永久删除',
    tone: 'danger',
    verificationText: project.title,
    verificationLabel: `请输入项目名称「${project.title}」确认`,
  })
  if (!confirmed) return
  actionBusyId.value = project.id
  try {
    await deleteProject(project.id)
    projects.value = projects.value.filter((item) => item.id !== project.id)
    toast.success('项目已永久删除')
  } catch (err) { toast.error('删除失败', messageOf(err)) } finally { actionBusyId.value = '' }
}'''
          projects.write_text(text[:start]+block+text[end+2:])

          assets=Path('apps/web/src/pages/BrandAssetsPage.vue')
          text=assets.read_text()
          if "useConfirmDialog" not in text:
              text=text.replace("import { useAuth } from '../composables/useAuth'", "import { useAuth } from '../composables/useAuth'\nimport { confirmDialog } from '../composables/useConfirmDialog'",1)
          text=text.replace("  if (!window.confirm(`永久删除资源「${asset.name}」？已插入项目的副本不会受影响。`)) return", "  if (!(await confirmDialog({ title: `删除品牌资源「${asset.name}」？`, description: '已插入项目的副本不会受影响，但资源库中将无法继续复用。', confirmLabel: '删除资源', tone: 'danger' }))) return")
          assets.write_text(text)

          kits=Path('apps/web/src/pages/BrandKitsPage.vue')
          text=kits.read_text()
          if "useConfirmDialog" not in text:
              text=text.replace("import { useAuth } from '../composables/useAuth'", "import { useAuth } from '../composables/useAuth'\nimport { confirmDialog } from '../composables/useConfirmDialog'",1)
          needle="""  const kit = pendingDelete.value
  if (!kit) return
  actionBusy.value = `delete:${kit.id}`
"""
          replacement="""  const kit = pendingDelete.value
  if (!kit) return
  if (!(await confirmDialog({ title: `删除品牌套件「${kit.name}」？`, description: '已应用到项目的版本不会改变；关联资源将保留但解除套件关联。', confirmLabel: '删除套件', tone: 'danger' }))) return
  actionBusy.value = `delete:${kit.id}`
"""
          if needle in text: text=text.replace(needle,replacement,1)
          kits.write_text(text)

          templates=Path('apps/web/src/pages/TemplatesPage.vue')
          text=templates.read_text()
          old='<button class="mt-5 flex w-full items-center justify-center gap-1.5 rounded-xl border border-line/10 bg-app/45 px-3 py-2.5 text-xs font-semibold text-sub hover:border-brand1/25 hover:text-brand1" @click="openTemplate(template)"><Eye class="h-3.5 w-3.5" />预览并使用</button>'
          new='<div class="mt-5 grid grid-cols-2 gap-2"><button class="flex items-center justify-center gap-1.5 rounded-xl border border-line/10 bg-app/45 px-3 py-2.5 text-xs font-semibold text-sub hover:border-brand1/25 hover:text-brand1" @click="openTemplate(template)"><Eye class="h-3.5 w-3.5" />快速预览</button><RouterLink :to="`/templates/${template.slug}`" class="flex items-center justify-center gap-1.5 rounded-xl bg-brand1/10 px-3 py-2.5 text-xs font-semibold text-brand1">完整详情<ArrowRight class="h-3.5 w-3.5" /></RouterLink></div>'
          if old in text: text=text.replace(old,new,1)
          templates.write_text(text)
          Path('.github/workflows/agent-confirmation-current.yml').unlink()
          PY
      - name: Commit confirmations
        run: |
          git config user.name 'SiteForge Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(web): standardize destructive confirmation flows'
          git push origin HEAD:agent/continue-development-20260723
