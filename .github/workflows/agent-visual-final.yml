name: Agent Visual Final
on:
  push:
    branches: [agent/continue-development-20260723]
    paths: ['.github/agent-visual-final.trigger']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/continue-development-20260723
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify final behavior and visual suite
        id: verify
        shell: bash
        run: |
          set +e
          python - <<'PY' > visual-final.log 2>&1
          from pathlib import Path
          path = Path('apps/web/src/pages/TemplateDetailPage.vue')
          text = path.read_text()
          replacements = [
            ('class="rounded-full bg-brand1/10 px-3 py-1 text-[10px] font-semibold text-brand1"', 'class="rounded-full bg-brand1/10 px-3 py-1 text-[10px] font-semibold text-sub"'),
            ('class="flex items-center gap-2 rounded-xl border border-brand1/20 bg-brand1/[0.07] px-4 py-3 text-sm font-semibold text-brand1"', 'class="flex items-center gap-2 rounded-xl border border-brand1/20 bg-brand1/[0.07] px-4 py-3 text-sm font-semibold text-sub hover:text-ink"'),
            ("'border-brand1/30 bg-brand1/[0.07] font-semibold text-brand1'", "'border-brand1/30 bg-brand1/[0.07] font-semibold text-sub'"),
          ]
          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'expected one match, found {count}: {old}')
            text = text.replace(old, new)
          path.write_text(text)
          PY
          PATCH_STATUS=$?
          if [[ $PATCH_STATUS -eq 0 ]]; then pnpm install --frozen-lockfile >> visual-final.log 2>&1; INSTALL_STATUS=$?; else INSTALL_STATUS=99; fi
          if [[ $INSTALL_STATUS -eq 0 ]]; then pnpm --filter web exec playwright install --with-deps chromium >> visual-final.log 2>&1; BROWSER_STATUS=$?; else BROWSER_STATUS=99; fi
          if [[ $BROWSER_STATUS -eq 0 ]]; then pnpm --filter web e2e:browser >> visual-final.log 2>&1; BEHAVIOR_STATUS=$?; else BEHAVIOR_STATUS=99; fi
          if [[ $BEHAVIOR_STATUS -eq 0 ]]; then pnpm --filter web e2e:visual:update >> visual-final.log 2>&1; VISUAL_STATUS=$?; else VISUAL_STATUS=99; fi
          printf 'patch=%s\ninstall=%s\nbrowser=%s\nbehavior=%s\nvisual=%s\n' "$PATCH_STATUS" "$INSTALL_STATUS" "$BROWSER_STATUS" "$BEHAVIOR_STATUS" "$VISUAL_STATUS" > visual-final-status.txt
          [[ $PATCH_STATUS -eq 0 && $INSTALL_STATUS -eq 0 && $BROWSER_STATUS -eq 0 && $BEHAVIOR_STATUS -eq 0 && $VISUAL_STATUS -eq 0 ]]
          echo "success=$([[ $? -eq 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit final result
        shell: bash
        run: |
          SUCCESS='${{ steps.verify.outputs.success }}'
          rm -f .github/agent-visual-final.trigger .github/workflows/agent-visual-final.yml .github/agent-visual-baseline-status.md
          if [[ "$SUCCESS" != 'true' ]]; then
            {
              echo '# Final visual diagnostic'
              echo
              cat visual-final-status.txt
              echo
              echo '## Log tail'
              echo '```text'
              tail -n 180 visual-final.log
              echo '```'
            } > .github/agent-visual-final-status.md
            rm -rf apps/web/test-results apps/web/playwright-report
          else
            rm -f .github/agent-visual-final-status.md visual-final.log visual-final-status.txt
          fi
          git config user.name "siteforge-agent"
          git config user.email "siteforge-agent@users.noreply.github.com"
          git add -A
          git commit -m "$([[ "$SUCCESS" == 'true' ]] && echo 'test(web): add verified visual regression baselines' || echo 'chore(ci): record final visual diagnostic')"
          git push origin HEAD:agent/continue-development-20260723
