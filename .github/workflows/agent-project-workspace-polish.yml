name: Agent Project Workspace Polish
on:
  push:
    branches: [agent/continue-development-20260723]
    paths: ['.github/workflows/agent-project-workspace-polish.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/continue-development-20260723
          fetch-depth: 0
      - name: Apply project quality and visual diff workspace
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/pages/ProjectPage.vue')
          text = path.read_text()
          text = text.replace("import VisualEditor from '../components/VisualEditor.vue'\nimport SiteQualityPanel from '../components/SiteQualityPanel.vue'", "import VisualEditor from '../components/VisualEditor.vue'\nimport ProjectQualityWorkspace from '../components/ProjectQualityWorkspace.vue'\nimport VersionVisualDiff from '../components/VersionVisualDiff.vue'")
          text = text.replace("const compareWidth = ref<'split' | 'current' | 'other'>('split')\n", '')
          focus_start = text.find('function focusIssue(issue: QualityIssue) {')
          if focus_start >= 0:
              focus_end = text.find('\n}\n\nfunction runNextAction', focus_start)
              if focus_end < 0: raise SystemExit('focusIssue end not found')
              text = text[:focus_start] + text[focus_end + 3:]
          old_quality = "          <SiteQualityPanel v-else-if=\"activeTab === 'quality' && selected\" class=\"min-h-[680px] rounded-none border-0\" :html=\"selected.html\" :ignored-rules=\"ignoredQualityRules\" @apply=\"applyIssue\" @apply-all=\"applyAllIssues\" @focus=\"focusIssue\" @ignore=\"ignoreRule\" />"
          new_quality = "          <ProjectQualityWorkspace v-else-if=\"activeTab === 'quality' && selected\" :html=\"selected.html\" :ignored-rules=\"ignoredQualityRules\" @apply=\"applyIssue\" @apply-all=\"applyAllIssues\" @ignore=\"ignoreRule\" />"
          if old_quality not in text: raise SystemExit('quality block not found')
          text = text.replace(old_quality, new_quality, 1)
          compare_start = text.find("          <div v-else-if=\"activeTab === 'compare'\"")
          compare_end = text.find('\n        </section>', compare_start)
          if compare_start < 0 or compare_end < 0: raise SystemExit('compare block not found')
          new_compare = '''          <div v-else-if="activeTab === 'compare'" class="min-h-[680px] p-3 sm:p-5">
            <div class="mb-4 flex flex-wrap items-center gap-3 rounded-2xl border border-line/10 bg-app/45 p-3">
              <label class="relative min-w-56 flex-1 sm:max-w-sm"><select v-model="compareVersionId" class="w-full appearance-none rounded-xl border border-line/10 bg-soft/65 py-2.5 pr-9 pl-3 text-xs outline-none"><option value="">选择对比版本</option><option v-for="version in versions.filter(item => item.id !== selected?.id)" :key="version.id" :value="version.id">{{ version.name || `第 ${version.version} 版` }}</option></select><ChevronDown class="pointer-events-none absolute top-1/2 right-3 h-3.5 w-3.5 -translate-y-1/2 text-faint" /></label>
              <button v-if="publishedVersion && publishedVersion.id !== selected?.id" class="rounded-xl border border-emerald-500/20 bg-emerald-500/[0.06] px-3 py-2.5 text-[10px] font-semibold text-emerald-600" @click="compareVersionId = publishedVersion.id">与线上第 {{ publishedVersion.version }} 版对比</button>
              <span v-if="compareVersion" class="ml-auto text-[10px] text-faint">{{ selected?.name || `第 ${selected?.version} 版` }} ↔ {{ compareVersion.name || `第 ${compareVersion.version} 版` }}</span>
            </div>
            <div v-if="compareLoading" class="flex min-h-[600px] items-center justify-center"><Loader2 class="h-6 w-6 animate-spin text-brand1" /></div>
            <VersionVisualDiff v-else-if="selected && compareVersion" :before-html="compareVersion.html" :after-html="selected.html" :before-label="compareVersion.name || `第 ${compareVersion.version} 版`" :after-label="selected.name || `第 ${selected.version} 版`" />
            <div v-else class="flex min-h-[600px] flex-col items-center justify-center rounded-2xl border border-dashed border-line/15 text-center"><Columns2 class="h-9 w-9 text-faint" /><h3 class="mt-4 text-sm font-semibold">选择一个版本开始对比</h3><p class="mt-2 text-xs text-mut">可滑动查看视觉变化，并按区块、内容、图片、链接、SEO 和样式筛选差异。</p></div>
          </div>'''
          text = text[:compare_start] + new_compare + text[compare_end:]
          old_editor = ':site-type="detail?.project.siteType" @close="editorOpen = false"'
          new_editor = ':site-type="detail?.project.siteType" :brand-kit-id="detail?.project.brandKitId" @close="editorOpen = false"'
          if old_editor not in text: raise SystemExit('editor props not found')
          text = text.replace(old_editor, new_editor, 1)
          path.write_text(text)
          Path('.github/workflows/agent-project-workspace-polish.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name 'SiteForge Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(web): upgrade project quality and version comparison'
          git push origin HEAD:agent/continue-development-20260723
