name: Agent Product Polish Patch

on:
  push:
    branches: [agent/continue-development-20260723]
    paths:
      - '.github/workflows/agent-product-polish-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/continue-development-20260723
          fetch-depth: 0
      - name: Apply precise TypeScript cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          removals = {
              'apps/web/src/components/GenerationBrief.vue': ['  Users,\n'],
              'apps/web/src/components/VisualEditor.vue': ['  ChevronLeft,\n'],
              'apps/web/src/pages/ProjectPage.vue': ['  CircleDot,\n', '  Note,\n', '  X,\n'],
              'apps/web/src/pages/TemplatesPage.vue': ['  Check,\n', '  Command,\n'],
              'apps/web/src/pages/BrandAssetsPage.vue': ['  Plus,\n'],
          }
          for name, needles in removals.items():
              path = Path(name)
              text = path.read_text()
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'Missing expected import in {name}: {needle!r}')
                  text = text.replace(needle, '', 1)
              path.write_text(text)

          quality = Path('apps/web/src/lib/siteQuality.ts')
          text = quality.read_text()
          old = "elementLabel: input.name || input.placeholder || input.tagName"
          new = "elementLabel: input.name || ('placeholder' in input ? input.placeholder : '') || input.tagName"
          if old not in text:
              raise SystemExit('Missing siteQuality placeholder expression')
          quality.write_text(text.replace(old, new, 1))

          compat = Path('apps/web/src/types/dom-compat.d.ts')
          if compat.exists():
              compat.unlink()

          workflow = Path('.github/workflows/agent-product-polish-patch.yml')
          workflow.unlink()
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SiteForge Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: clean product polish TypeScript diagnostics'
          git push origin HEAD:agent/continue-development-20260723
