name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck.log

      - name: 上传类型检查诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: typecheck.log
          retention-days: 7

      - name: Build(web + server + shared)
        run: pnpm build

      - name: 全仓单元测试
        run: pnpm test

      - name: 前端生成链路 E2E
        run: pnpm --filter web e2e

      - name: 前端迭代链路 E2E
        run: pnpm --filter web e2e:iterate

      - name: 前端历史恢复 E2E
        run: pnpm --filter web e2e:history
