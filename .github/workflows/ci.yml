name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck.log
      - name: 上传类型检查诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: typecheck.log
          retention-days: 7
      - name: Build(web + server + shared)
        run: pnpm build
      - name: Web bundle 性能预算
        run: pnpm --filter web check:bundle-budget
      - name: Prompt 质量评测管线自检
        run: pnpm --filter prompts eval:quality -- --dry-run --runs 1 --report ../../artifacts/prompt-eval.json
      - name: 上传 Beta Readiness 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-readiness-reports
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: 全仓单元测试
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test.log
      - name: 上传单元测试诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          retention-days: 7
      - name: 真实生成与迭代 E2E
        shell: bash
        env:
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
          EVAL_BASE_URL: ${{ secrets.EVAL_BASE_URL }}
          EVAL_MODEL: ${{ secrets.EVAL_MODEL }}
        run: |
          set -euo pipefail
          if [[ -z "${EVAL_API_KEY:-}" ]]; then
            echo "未配置 EVAL_API_KEY,跳过需要真实模型的生成与迭代 E2E。"
            exit 0
          fi
          pnpm --filter server start > server-e2e.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then echo "服务端提前退出:"; cat server-e2e.log; exit 1; fi
            if [[ "$attempt" == 30 ]]; then echo "服务端健康检查超时:"; cat server-e2e.log; exit 1; fi
            sleep 1
          done
          export E2E_ENDPOINT=http://127.0.0.1:8787/api/generate
          pnpm --filter web e2e
          pnpm --filter web e2e:iterate
      - name: 上传真实 E2E 服务端日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-e2e-log
          path: server-e2e.log
          if-no-files-found: ignore
          retention-days: 7
      - name: 前端历史恢复 E2E
        run: pnpm --filter web e2e:history

  browser-quality:
    name: playwright-browser-quality
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 安装 Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: 浏览器交互与无障碍 E2E
        run: pnpm --filter web e2e:browser
      - name: 视觉回归测试
        run: pnpm --filter web e2e:visual
      - name: 上传 Playwright 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  mysql-integration:
    name: mysql-8-integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-password
          MYSQL_DATABASE: siteforge
          MYSQL_USER: siteforge
          MYSQL_PASSWORD: siteforge-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: MySQL migration + 事务并发 + 回滚
        working-directory: apps/server
        env:
          NODE_ENV: development
          DATA_STORAGE_DRIVER: mysql
          MYSQL_URL: mysql://siteforge:siteforge-password@127.0.0.1:3306/siteforge
          MYSQL_SSL_MODE: disabled
          AUTH_JWT_SECRET: mysql-ci-auth-secret-change-before-production-2026
        run: pnpm db:mysql:ci

  apply-dotenv-change:
    if: github.head_ref == 'agent/dotenv-server-env-loading-20260724' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dotenv-server-env-loading-20260724
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 安装现有依赖
        run: pnpm install --frozen-lockfile
      - name: 应用 dotenv 集成
        shell: bash
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          package_path = Path('apps/server/package.json')
          package = json.loads(package_path.read_text())
          package.setdefault('dependencies', {})['dotenv'] = '^17.4.2'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          Path('apps/server/src/lib/load-environment.ts').write_text("""import { config } from 'dotenv'

/** Load a dotenv file without overriding values injected by the OS or deployment platform. */
export function loadEnvironmentFile(path: string): void {
  const result = config({ path, override: false, quiet: true })
  if (!result.error) return

  const code = (result.error as NodeJS.ErrnoException).code
  if (code === 'ENOENT') return

  throw new Error(`ENV_FILE_LOAD_FAILED ${path}: ${result.error.message}`)
}
""")

          env_path = Path('apps/server/src/env.ts')
          env_source = env_path.read_text()
          marker = "import { z } from 'zod'\n"
          replacement = "import { fileURLToPath } from 'node:url'\nimport { z } from 'zod'\nimport { loadEnvironmentFile } from './lib/load-environment'\n\nloadEnvironmentFile(fileURLToPath(new URL('../.env', import.meta.url)))\n"
          if "loadEnvironmentFile(fileURLToPath" not in env_source:
              if marker not in env_source:
                  raise SystemExit('env.ts import marker not found')
              env_path.write_text(env_source.replace(marker, replacement, 1))

          Path('apps/server/test/dotenv-loading.test.ts').write_text("""import { mkdtemp, rm, writeFile } from 'node:fs/promises'
import { tmpdir } from 'node:os'
import path from 'node:path'
import { afterEach, describe, expect, it } from 'vitest'
import { loadEnvironmentFile } from '../src/lib/load-environment'

const FILE_VALUE = 'SITEFORGE_DOTENV_FILE_VALUE'
const EXISTING_VALUE = 'SITEFORGE_DOTENV_EXISTING_VALUE'
const temporaryDirectories: string[] = []

afterEach(async () => {
  delete process.env[FILE_VALUE]
  delete process.env[EXISTING_VALUE]
  await Promise.all(temporaryDirectories.splice(0).map((directory) => rm(directory, { recursive: true, force: true })))
})

async function temporaryEnvFile(content: string): Promise<string> {
  const directory = await mkdtemp(path.join(tmpdir(), 'siteforge-dotenv-'))
  temporaryDirectories.push(directory)
  const file = path.join(directory, '.env')
  await writeFile(file, content, 'utf8')
  return file
}

describe('dotenv environment loading', () => {
  it('loads values from the requested file without overriding process variables', async () => {
    process.env[EXISTING_VALUE] = 'from-process'
    const file = await temporaryEnvFile([
      `${FILE_VALUE}=from-file`,
      `${EXISTING_VALUE}=from-file`,
      '',
    ].join('\n'))

    loadEnvironmentFile(file)

    expect(process.env[FILE_VALUE]).toBe('from-file')
    expect(process.env[EXISTING_VALUE]).toBe('from-process')
  })

  it('allows the local env file to be absent in CI and managed deployments', async () => {
    const directory = await mkdtemp(path.join(tmpdir(), 'siteforge-dotenv-missing-'))
    temporaryDirectories.push(directory)
    expect(() => loadEnvironmentFile(path.join(directory, '.env'))).not.toThrow()
  })
})
""")

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          before = """pnpm install
cp apps/server/.env.example apps/server/.env
pnpm dev
```

默认地址："""
          after = """pnpm install
cp apps/server/.env.example apps/server/.env
pnpm dev
```

服务端通过 `dotenv` 自动加载 `apps/server/.env`，无需在终端执行 `source`。操作系统、Docker、CI 或部署平台已经注入的环境变量优先，不会被本地文件覆盖；修改 `.env` 后需重启服务端进程。

默认地址："""
          if before not in readme:
              raise SystemExit('README local development marker not found')
          readme_path.write_text(readme.replace(before, after, 1))
          PY
      - name: 更新依赖锁文件
        run: pnpm install --no-frozen-lockfile
      - name: 验证服务端
        run: |
          pnpm --filter server typecheck
          pnpm --filter server test
          pnpm --filter server build
      - name: 提交最终改动并清理临时工作流
        shell: bash
        run: |
          git fetch origin agent/ownership-and-brand-kit-assets-20260724
          git checkout origin/agent/ownership-and-brand-kit-assets-20260724 -- .github/workflows/ci.yml
          rm -f .github/workflows/apply-dotenv-env-loading.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md apps/server/package.json apps/server/src/env.ts apps/server/src/lib/load-environment.ts apps/server/test/dotenv-loading.test.ts pnpm-lock.yaml .github/workflows/ci.yml .github/workflows/apply-dotenv-env-loading.yml
          git commit -m "chore: load server environment with dotenv"
          git push origin HEAD:agent/dotenv-server-env-loading-20260724
