name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck.log
      - name: 上传类型检查诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: typecheck.log
          retention-days: 7
      - name: Build(web + server + shared)
        run: pnpm build
      - name: Web bundle 性能预算
        run: pnpm --filter web check:bundle-budget
      - name: Prompt 质量评测管线自检
        run: pnpm --filter prompts eval:quality -- --dry-run --runs 1 --report ../../artifacts/prompt-eval.json
      - name: 上传 Beta Readiness 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-readiness-reports
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: 全仓单元测试
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test.log
      - name: 上传单元测试诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          retention-days: 7
      - name: 真实生成与迭代 E2E
        shell: bash
        env:
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
          EVAL_BASE_URL: ${{ secrets.EVAL_BASE_URL }}
          EVAL_MODEL: ${{ secrets.EVAL_MODEL }}
        run: |
          set -euo pipefail
          if [[ -z "${EVAL_API_KEY:-}" ]]; then
            echo "未配置 EVAL_API_KEY,跳过需要真实模型的生成与迭代 E2E。"
            exit 0
          fi
          pnpm --filter server start > server-e2e.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then echo "服务端提前退出:"; cat server-e2e.log; exit 1; fi
            if [[ "$attempt" == 30 ]]; then echo "服务端健康检查超时:"; cat server-e2e.log; exit 1; fi
            sleep 1
          done
          export E2E_ENDPOINT=http://127.0.0.1:8787/api/generate
          pnpm --filter web e2e
          pnpm --filter web e2e:iterate
      - name: 上传真实 E2E 服务端日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-e2e-log
          path: server-e2e.log
          if-no-files-found: ignore
          retention-days: 7
      - name: 前端历史恢复 E2E
        run: pnpm --filter web e2e:history

  browser-quality:
    name: playwright-browser-quality
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 安装 Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: 浏览器交互与无障碍 E2E
        run: pnpm --filter web e2e:browser
      - name: 视觉回归测试
        run: pnpm --filter web e2e:visual
      - name: 上传 Playwright 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  mysql-integration:
    name: mysql-8-integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-password
          MYSQL_DATABASE: siteforge
          MYSQL_USER: siteforge
          MYSQL_PASSWORD: siteforge-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: MySQL migration + 事务并发 + 回滚
        working-directory: apps/server
        env:
          NODE_ENV: development
          DATA_STORAGE_DRIVER: mysql
          MYSQL_URL: mysql://siteforge:siteforge-password@127.0.0.1:3306/siteforge
          MYSQL_SSL_MODE: disabled
          AUTH_JWT_SECRET: mysql-ci-auth-secret-change-before-production-2026
        run: pnpm db:mysql:ci

  apply-generation-quality-speed:
    if: github.head_ref == 'agent/generation-quality-speed-20260724' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/generation-quality-speed-20260724
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 应用生成质量与速度优化
        run: |
          python scripts/fix-generation-test-typing.py
          python scripts/apply-generation-quality-speed.py
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee generation-typecheck.log
      - name: 上传生成优化 Typecheck 诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generation-typecheck-log
          path: generation-typecheck.log
          retention-days: 7
      - name: 全仓测试
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee generation-test.log
      - name: 上传生成优化测试诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generation-test-log
          path: generation-test.log
          retention-days: 7
      - name: 全仓构建
        run: pnpm build
      - name: 提交最终代码并清理临时文件
        shell: bash
        run: |
          git fetch origin agent/dotenv-server-env-loading-20260724
          git checkout origin/agent/dotenv-server-env-loading-20260724 -- .github/workflows/ci.yml
          rm -f scripts/apply-generation-quality-speed.py scripts/fix-generation-test-typing.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add generation quality and speed modes"
          git push origin HEAD:agent/generation-quality-speed-20260724
