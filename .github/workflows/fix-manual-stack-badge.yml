name: Apply Manual Wizard Contrast Fix

on:
  push:
    branches:
      - Feature-dev-v0.1.0

permissions:
  contents: write

concurrency:
  group: fix-manual-stack-badge
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Feature-dev-v0.1.0
          fetch-depth: 0
      - name: Update the reviewed badge classes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/pages/ManualProjectPage.vue')
          content = path.read_text()
          old = 'rounded-full bg-emerald-500/10 px-2 py-0.5 text-[9px] font-semibold text-emerald-600'
          new = 'rounded-full border border-emerald-500/25 bg-emerald-500/10 px-2 py-0.5 text-[9px] font-semibold text-ink'
          if content.count(old) != 1:
              raise SystemExit(f'expected one badge occurrence, got {content.count(old)}')
          path.write_text(content.replace(old, new))
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-manual-stack-badge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/ManualProjectPage.vue
          git commit -m "fix(web): improve recommended stack badge contrast"
          git push origin HEAD:Feature-dev-v0.1.0
