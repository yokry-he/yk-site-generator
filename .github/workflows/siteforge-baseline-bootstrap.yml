name: SiteForge visual baseline bootstrap

on:
  push:
    branches:
      - agent/continue-development-20260723
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Generate and commit visual quality baseline
        shell: bash
        run: |
          set +e
          pnpm --filter web e2e:visual:update 2>&1 | tee visual-bootstrap.log
          visual_code=${PIPESTATUS[0]}
          set -e

          finalize_baseline() {
            python - <<'PY'
          from pathlib import Path
          from fnmatch import fnmatch

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count == 1:
                  path.write_text(text.replace(old, new), encoding='utf-8')
              elif count == 0 and new in text:
                  return
              else:
                  raise SystemExit(f'{path}: expected one target, found {count}')

          ci = Path('.github/workflows/ci.yml')
          replace_once(
              ci,
              '      - name: 浏览器交互与无障碍 E2E\n        run: pnpm --filter web e2e:browser\n      - name: 上传 Playwright 报告',
              '      - name: 浏览器交互与无障碍 E2E\n        run: pnpm --filter web e2e:browser\n      - name: 视觉回归测试\n        run: pnpm --filter web e2e:visual\n      - name: 上传 Playwright 报告',
          )

          readme = Path('README.md')
          replace_once(readme, '- 项目收藏、复制、归档、回收站、恢复和永久删除\n', '- 项目收藏、复制、归档、回收站、恢复和永久删除\n- 永久删除必须输入完整项目名称确认，避免误删不可恢复的数据\n')
          replace_once(readme, '- 用户间资源严格隔离，删除资源不会破坏已插入项目的副本\n', '- 用户间资源严格隔离，删除资源不会破坏已插入项目的副本\n- 删除品牌资源前展示关联品牌套件、项目版本与已插入副本的影响范围，并通过统一危险操作确认\n')
          replace_once(readme, '- 响应式 iframe 预览，支持桌面、平板和手机尺寸\n', '- 响应式 iframe 预览，支持桌面、平板和手机尺寸\n- 模板卡片提供快速预览，独立详情页提供完整多端预览、变量定制、品牌联动与创建项目入口\n')
          replace_once(readme, '- 项目概览和编辑器共用同一套质量分析规则\n', '- 项目概览和编辑器共用同一套质量分析规则\n- Playwright 浏览器行为矩阵覆盖桌面与 Pixel 7 手机视口，验证首页、命令面板、模板目录／详情、项目工作区、编辑器及关键 Dialog／Drawer 的键盘操作\n- Axe 自动无障碍门槛禁止 serious 或 critical 违规，并检查图标按钮的可访问名称\n- 自动验证 Skip Link 是首次 Tab 可达元素、弹层焦点进入与恢复正确、关键页面无横向溢出\n- 视觉回归覆盖首页、全局命令面板、模板目录、模板详情、项目工作区、可视化编辑器和深色模板详情的桌面／手机截图\n')
          replace_once(readme, 'pnpm --filter web e2e:history\npnpm --filter prompts eval -- --dry-run', 'pnpm --filter web e2e:history\npnpm --filter web e2e:browser\npnpm --filter web e2e:visual\npnpm --filter web e2e:visual:update\npnpm --filter prompts eval -- --dry-run')
          replace_once(readme, '- 真实生成、迭代和历史恢复 E2E\n- MySQL 8.4 Service Container', '- 真实生成、迭代和历史恢复 E2E\n- Playwright 桌面与手机行为矩阵、响应式溢出、Skip Link、焦点管理和键盘操作\n- Axe serious／critical 自动无障碍门槛\n- 首页、命令面板、模板、项目工作区、编辑器与深色页面的视觉回归比较\n- MySQL 8.4 Service Container')

          protected = Path('.github/workflows/siteforge-baseline-bootstrap.yml')
          for path in Path('.github').rglob('*'):
              if not path.is_file() or path == protected:
                  continue
              name = path.name
              if fnmatch(name, 'agent-*trigger*') or fnmatch(name, 'agent-visual-*') or name in {'visual-baseline-status.txt', 'visual-final-status.txt'}:
                  path.unlink()
                  print(f'Removed temporary file: {path}')
          PY

            snapshot_dir=apps/web/tests/e2e/visual.spec.ts-snapshots
            test -d "$snapshot_dir"
            snapshot_count=$(find "$snapshot_dir" -type f -name '*.png' | wc -l)
            echo "Generated ${snapshot_count} visual snapshots"
            test "$snapshot_count" -ge 13
            grep -n "视觉回归测试\|e2e:visual" .github/workflows/ci.yml README.md
            git diff --check
          }

          finalize_code=0
          if [[ "$visual_code" -eq 0 ]]; then
            set +e
            finalize_baseline 2>&1 | tee -a visual-bootstrap.log
            finalize_code=${PIPESTATUS[0]}
            set -e
          fi

          result_code="$visual_code"
          if [[ "$result_code" -eq 0 ]]; then result_code="$finalize_code"; fi

          git config user.name "siteforge-agent"
          git config user.email "siteforge-agent@users.noreply.github.com"

          if [[ "$result_code" -ne 0 ]]; then
            git reset --hard HEAD
            git clean -fd -- apps/web/tests/e2e/visual.spec.ts-snapshots apps/web/playwright-report apps/web/test-results
            {
              echo "visual_code=${visual_code}"
              echo "finalize_code=${finalize_code}"
              echo
              tail -n 220 visual-bootstrap.log
            } > .github/visual-baseline-status.txt
            git add .github/visual-baseline-status.txt
            git commit -m "chore(ci): record visual baseline bootstrap failure"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            exit "$result_code"
          fi

          rm -f .github/visual-baseline-status.txt .github/visual-final-status.txt
          git add apps/web/tests/e2e/visual.spec.ts-snapshots .github/workflows/ci.yml README.md
          git add -u .github
          git status --short
          git commit -m "test(web): establish visual quality baseline"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-bootstrap-report
          path: |
            visual-bootstrap.log
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
