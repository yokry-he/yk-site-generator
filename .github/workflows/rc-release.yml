name: RC Release Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Candidate version from release/rc-manifest.json
        required: true
        default: 0.1.0-rc.1

permissions:
  contents: read

concurrency:
  group: rc-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RC_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
  RC_EVIDENCE_SIGNING_KEY: ${{ secrets.RC_EVIDENCE_SIGNING_KEY }}

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm rc:evidence --gate docs --details "Bilingual documentation gate"
      - run: pnpm rc:audit
      - run: pnpm rc:evidence --gate integrity --details "Deterministic scaffold integrity"
      - run: pnpm rc:security
      - run: pnpm rc:evidence --gate security --details "RC attack-surface audit" --artifacts artifacts/security-audit.json
      - run: pnpm runner:images:validate
      - run: pnpm rc:evidence --gate runner-images --details "Runner Dockerfile and digest policy"
      - run: pnpm typecheck
      - run: pnpm rc:evidence --gate typecheck
      - run: pnpm build
      - run: pnpm rc:evidence --gate build
      - run: pnpm test
      - run: pnpm rc:evidence --gate unit
      - run: pnpm --filter web check:bundle-budget
      - run: pnpm rc:evidence --gate bundle
      - uses: actions/upload-artifact@v4
        with:
          name: rc-evidence-core
          path: |
            artifacts/rc-evidence
            artifacts/security-audit.json
          retention-days: 14

  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-password
          MYSQL_DATABASE: siteforge
          MYSQL_USER: siteforge
          MYSQL_PASSWORD: siteforge-password
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: MySQL migration, concurrency and rollback
        working-directory: apps/server
        env:
          NODE_ENV: development
          DATA_STORAGE_DRIVER: mysql
          MYSQL_URL: mysql://siteforge:siteforge-password@127.0.0.1:3306/siteforge
          MYSQL_SSL_MODE: disabled
          AUTH_JWT_SECRET: mysql-rc-secret-change-before-production-2026
        run: pnpm db:mysql:ci
      - run: pnpm rc:evidence --gate mysql
      - uses: actions/upload-artifact@v4
        with: { name: rc-evidence-mysql, path: artifacts/rc-evidence, retention-days: 14 }

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e:browser
      - run: pnpm rc:evidence --gate browser --details "Playwright interaction suite"
      - run: pnpm rc:evidence --gate accessibility --details "Axe checks are part of browser suite"
      - run: pnpm --filter web e2e:visual
      - run: pnpm rc:evidence --gate visual --details "Visual regression"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc-evidence-browser
          path: |
            artifacts/rc-evidence
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 14

  redis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:8-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter server build
      - name: Two API instances sharing Redis
        env:
          NODE_ENV: development
          AUTH_DISTRIBUTED_LIMIT_DRIVER: redis
          REDIS_URL: redis://127.0.0.1:6379/0
          AUTH_RATE_LIMIT_FAIL_MODE: closed
          AUTH_MAX_VERIFY_FAILURES: 3
          AUTH_JWT_SECRET: redis-rc-jwt-secret-change-me-2026
          AUTH_RATE_LIMIT_HASH_KEY: redis-rc-hash-secret-change-me-2026
        run: |
          PORT=8787 DATA_STORAGE_FILE=.data/redis-a.json node apps/server/dist/index.js > redis-a.log 2>&1 &
          PORT=8788 DATA_STORAGE_FILE=.data/redis-b.json node apps/server/dist/index.js > redis-b.log 2>&1 &
          for port in 8787 8788; do for attempt in {1..30}; do curl -fsS "http://127.0.0.1:$port/api/health/live" && break || sleep 1; done; done
          pnpm rc:redis
      - run: pnpm rc:evidence --gate redis-multi-instance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc-evidence-redis
          path: |
            artifacts/rc-evidence
            redis-*.log
          retention-days: 14

  golden-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project:
          - hono-drizzle-sqlite
          - nestjs-prisma-postgresql
          - fastapi-sqlalchemy-postgresql
          - spring-boot-jpa-postgresql
          - gin-gorm-postgresql
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: siteforge
          POSTGRES_PASSWORD: siteforge
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U siteforge -d postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.x', cache: false }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client && python -m pip install uv
      - run: pnpm install --frozen-lockfile
      - run: pnpm rc:golden
      - run: pnpm rc:matrix --project ${{ matrix.project }}
      - run: pnpm rc:evidence --gate "golden-runtime:${{ matrix.project }}" --details "Real install/migrate/build/test/start/auth smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc-evidence-golden-${{ matrix.project }}
          path: |
            artifacts/rc-evidence
            artifacts/rc-matrix
          retention-days: 14

  assemble:
    needs: [core, mysql, browser, redis, golden-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: rc-evidence-*
          path: artifacts/rc-evidence
          merge-multiple: true
      - run: pnpm rc:prepare --commit "${GITHUB_SHA}" --version "${{ inputs.candidate_version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: siteforge-${{ inputs.candidate_version }}-bundle
          path: artifacts/rc-release
          retention-days: 30
