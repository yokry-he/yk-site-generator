name: Agent Mobile Version Drawer
on:
  push:
    branches: [agent/continue-development-20260723]
    paths: ['.github/workflows/agent-mobile-version-drawer.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/continue-development-20260723
          fetch-depth: 0
      - name: Add mobile version navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/pages/ProjectPage.vue')
          text = path.read_text()
          text = text.replace("import VersionVisualDiff from '../components/VersionVisualDiff.vue'", "import VersionVisualDiff from '../components/VersionVisualDiff.vue'\nimport MobileVersionDrawer from '../components/MobileVersionDrawer.vue'")
          text = text.replace("const editorOpen = ref(false)\n", "const editorOpen = ref(false)\nconst mobileVersionsOpen = ref(false)\n")
          old = '<button v-if="selected" :disabled="actionBusy === \'export\'" class="flex items-center gap-1.5 rounded-xl border border-line/12 bg-ink/[0.04] px-3.5 py-2.5 text-xs font-medium text-sub" @click="exportZip">'
          new = '<button class="flex items-center gap-1.5 rounded-xl border border-line/12 bg-ink/[0.04] px-3 py-2.5 text-xs font-medium text-sub lg:hidden" @click="mobileVersionsOpen = true"><History class="h-3.5 w-3.5" />版本</button>' + old
          if old not in text: raise SystemExit('project header action not found')
          text = text.replace(old, new, 1)
          old = '<aside class="overflow-hidden rounded-2xl border border-line/10 bg-soft/65">'
          new = '<aside class="hidden overflow-hidden rounded-2xl border border-line/10 bg-soft/65 lg:block">'
          if old not in text: raise SystemExit('version aside not found')
          text = text.replace(old, new, 1)
          old = '    <VisualEditor v-if="selected"'
          new = '''    <MobileVersionDrawer :open="mobileVersionsOpen" :versions="versions" :selected-id="selected?.id" :busy="actionBusy" @close="mobileVersionsOpen = false" @select="selectVersion" @rollback="rollback" />
    <VisualEditor v-if="selected"'''
          if old not in text: raise SystemExit('visual editor mount not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          Path('.github/workflows/agent-mobile-version-drawer.yml').unlink()
          PY
      - name: Commit mobile version drawer
        run: |
          git config user.name 'SiteForge Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(web): add mobile project version drawer'
          git push origin HEAD:agent/continue-development-20260723
