name: RC Golden Runtime Matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project:
          - hono-drizzle-sqlite
          - nestjs-prisma-postgresql
          - fastapi-sqlalchemy-postgresql
          - spring-boot-jpa-postgresql
          - gin-gorm-postgresql
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: siteforge
          POSTGRES_PASSWORD: siteforge
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U siteforge -d postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rc-node-bootstrap
        with:
          preflight-profile: release
          dependency-mode: all
          artifact-name: rc-bootstrap-golden-${{ matrix.project }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.x', cache: false }
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client && python -m pip install uv
      - name: Materialize Golden Projects
        run: pnpm rc:golden
      - name: Execute selected runtime matrix
        run: pnpm rc:matrix --project ${{ matrix.project }}
      - name: Upload matrix logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-matrix-${{ matrix.project }}
          path: artifacts/rc-matrix
          if-no-files-found: warn
          retention-days: 14
      - name: Aggregate matrix diagnostics
        if: always()
        uses: ./.github/actions/rc-diagnostic-triage
        with:
          scope: golden-${{ matrix.project }}
          artifact-name: rc-triage-golden-${{ matrix.project }}
          external-status: ${{ job.status }}
