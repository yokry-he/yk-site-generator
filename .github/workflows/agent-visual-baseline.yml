name: Agent Visual Baseline
on:
  push:
    branches: [agent/continue-development-20260723]
    paths: ['.github/agent-visual-baseline.trigger']
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/continue-development-20260723
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify and generate baselines
        id: verify
        shell: bash
        run: |
          set +e
          python - <<'PY' > visual-baseline.log 2>&1
          from pathlib import Path
          path = Path('apps/web/src/pages/TemplatesPage.vue')
          text = path.read_text()
          old = 'class="flex items-center justify-center gap-1.5 rounded-xl bg-brand1/10 px-3 py-2.5 text-xs font-semibold text-brand1 hover:bg-brand1/15">完整详情'
          new = 'class="flex items-center justify-center gap-1.5 rounded-xl bg-brand1/10 px-3 py-2.5 text-xs font-semibold text-sub hover:bg-brand1/15 hover:text-ink">完整详情'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one full-detail link, found {count}')
          path.write_text(text.replace(old, new))
          PY
          PATCH_STATUS=$?
          if [[ $PATCH_STATUS -eq 0 ]]; then pnpm install --frozen-lockfile >> visual-baseline.log 2>&1; INSTALL_STATUS=$?; else INSTALL_STATUS=99; fi
          if [[ $INSTALL_STATUS -eq 0 ]]; then pnpm --filter web exec playwright install --with-deps chromium >> visual-baseline.log 2>&1; BROWSER_STATUS=$?; else BROWSER_STATUS=99; fi
          if [[ $BROWSER_STATUS -eq 0 ]]; then pnpm --filter web e2e:browser >> visual-baseline.log 2>&1; BEHAVIOR_STATUS=$?; else BEHAVIOR_STATUS=99; fi
          if [[ $BEHAVIOR_STATUS -eq 0 ]]; then pnpm --filter web e2e:visual:update >> visual-baseline.log 2>&1; VISUAL_STATUS=$?; else VISUAL_STATUS=99; fi
          printf 'patch=%s\ninstall=%s\nbrowser=%s\nbehavior=%s\nvisual=%s\n' "$PATCH_STATUS" "$INSTALL_STATUS" "$BROWSER_STATUS" "$BEHAVIOR_STATUS" "$VISUAL_STATUS" > visual-baseline-status.txt
          if [[ $PATCH_STATUS -eq 0 && $INSTALL_STATUS -eq 0 && $BROWSER_STATUS -eq 0 && $BEHAVIOR_STATUS -eq 0 && $VISUAL_STATUS -eq 0 ]]; then
            echo success=true >> "$GITHUB_OUTPUT"
          else
            echo success=false >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Commit result
        run: |
          SUCCESS='${{ steps.verify.outputs.success }}'
          rm -f .github/agent-visual-baseline.trigger .github/workflows/agent-visual-baseline.yml
          if [[ "$SUCCESS" != 'true' ]]; then
            {
              echo '# Visual baseline diagnostic'
              echo
              cat visual-baseline-status.txt
              echo
              echo '## Log tail'
              echo '```text'
              tail -n 160 visual-baseline.log
              echo '```'
            } > .github/agent-visual-baseline-status.md
            rm -rf apps/web/test-results apps/web/playwright-report
          else
            rm -f .github/agent-visual-baseline-status.md visual-baseline.log visual-baseline-status.txt
          fi
          git config user.name "siteforge-agent"
          git config user.email "siteforge-agent@users.noreply.github.com"
          git add -A
          git commit -m "$([[ "$SUCCESS" == 'true' ]] && echo 'test(web): add verified visual regression baselines' || echo 'chore(ci): record visual baseline diagnostic')"
          git push origin HEAD:agent/continue-development-20260723
