name: Apply CLS Stability Fix

on:
  pull_request:
    branches: [agent/beta-readiness-foundation-20260724]
    paths:
      - .github/workflows/agent-apply-cls-fix.yml
      - .github/scripts/patch-cls.py

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/web-performance-baseline-20260724'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/web-performance-baseline-20260724
      - name: 应用页面布局稳定性修复
        run: python .github/scripts/patch-cls.py
      - name: 提交页面修复
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages .github/scripts/patch-cls.py
          git commit -m "perf(web): stabilize async page layouts"
          git push origin HEAD:agent/web-performance-baseline-20260724
