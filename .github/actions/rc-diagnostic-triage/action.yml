name: RC diagnostic triage
description: Aggregate RC diagnostic JSON reports into a prioritized remediation plan and upload it.

inputs:
  scope:
    description: Stable job or matrix scope used in the report directory.
    required: true
  artifact-name:
    description: Unique artifact name for the triage report.
    required: true
  external-status:
    description: Current GitHub job status.
    required: false
    default: success
  source-root:
    description: Root directory containing downloaded or locally produced diagnostic artifacts.
    required: false
    default: artifacts
  allow-missing:
    description: Treat missing diagnostic JSON as advisory rather than blocking.
    required: false
    default: 'true'
  fail-on:
    description: Failure threshold (blocking, P0, P1, P2, P3, or never).
    required: false
    default: blocking

runs:
  using: composite
  steps:
    - name: Aggregate RC diagnostics
      shell: bash
      run: |
        set -euo pipefail
        node --test scripts/rc-triage.test.mjs
        node scripts/rc-triage.mjs \
          --scope="${{ inputs.scope }}" \
          --source-root="${{ inputs.source-root }}" \
          --report-dir="artifacts/rc-triage/${{ inputs.scope }}" \
          --allow-missing="${{ inputs.allow-missing }}" \
          --external-status="${{ inputs.scope }}:${{ inputs.external-status }}" \
          --fail-on="${{ inputs.fail-on }}"

    - name: Upload RC triage report
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: artifacts/rc-triage/${{ inputs.scope }}
        if-no-files-found: warn
        retention-days: 14
