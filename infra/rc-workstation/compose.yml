name: siteforge-rc

services:
  workstation:
    build:
      context: ../..
      dockerfile: infra/rc-workstation/Dockerfile
      args:
        USER_UID: ${RC_WORKSTATION_UID:-10001}
        USER_GID: ${RC_WORKSTATION_GID:-10001}
    init: true
    working_dir: /workspace
    command: ["sleep", "infinity"]
    environment:
      CI: "true"
      PNPM_STORE_DIR: /home/siteforge/.local/share/pnpm/store
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      DATABASE_URL: postgresql://siteforge:siteforge-local@postgres:5432/siteforge
      MYSQL_URL: mysql://siteforge:siteforge-local@mysql:3306/siteforge
      REDIS_URL: redis://redis:6379/0
      RC_POSTGRES_HOST: postgres
      RC_POSTGRES_PORT: "5432"
      RC_POSTGRES_USER: siteforge
      RC_POSTGRES_PASSWORD: siteforge-local
      RC_POSTGRES_ADMIN_DATABASE: postgres
      RC_POSTGRES_DATABASE_PREFIX: sf_
    volumes:
      - ../..:/workspace
      - pnpm-store:/home/siteforge/.local/share/pnpm/store
      - maven-cache:/home/siteforge/.m2
      - go-cache:/home/siteforge/go
      - uv-cache:/home/siteforge/.cache/uv
    networks:
      - rc-internal
      - rc-egress
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    mem_limit: 8g
    cpus: 4
    healthcheck:
      test: ["CMD-SHELL", "node --version && pnpm --version && python3 --version && go version && java -version && mvn -version"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: siteforge-root-local
      MYSQL_DATABASE: siteforge
      MYSQL_USER: siteforge
      MYSQL_PASSWORD: siteforge-local
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [rc-internal]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -psiteforge-root-local"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: siteforge
      POSTGRES_PASSWORD: siteforge-local
      POSTGRES_DB: siteforge
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [rc-internal]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siteforge -d siteforge"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    networks: [rc-internal]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

networks:
  rc-internal:
    internal: true
  rc-egress: {}

volumes:
  pnpm-store: {}
  maven-cache: {}
  go-cache: {}
  uv-cache: {}
  mysql-data: {}
  postgres-data: {}
  redis-data: {}
